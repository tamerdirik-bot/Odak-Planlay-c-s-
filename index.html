<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odak Planlayıcı</title>
<meta name="description" content="Pomodoro tekniğiyle çalışan görev planlayıcı ve odak sayacı">
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1219" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Odak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Mono:wght@500;700&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: top bar with Planla / Yeni görev, four tabs (Bugün, Hafta, Görevler, Arşiv) plus the Planla screen.
   The running program takes the whole screen: task colour while focusing, calm blue during breaks, draining like an hourglass. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --ink:#151A26; --muted:#5A6376; --line:#D3D8E2; --accent:#2B3A8C;
  --red:#C2301F; --orange:#C96A08; --green:#23804A; --blue:#2F7BA3;
  --red-deep:#A8261A; --orange-deep:#A65200; --green-deep:#1B6E3F; --blue-deep:#22536E;
  --f-display:"Red Hat Display",system-ui,sans-serif;
  --f-body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1219; --surface:#181D27; --ink:#E7EAF2; --muted:#98A1B4; --line:#2B3342; --accent:#93A5FF;
    --red:#F26755; --orange:#F2983A; --green:#4DC07A; --blue:#62AED6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1219; --surface:#181D27; --ink:#E7EAF2; --muted:#98A1B4; --line:#2B3342; --accent:#93A5FF;
  --red:#F26755; --orange:#F2983A; --green:#4DC07A; --blue:#62AED6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.h3{font-size:1rem}
[data-g="r"]{--g:var(--red);--gd:var(--red-deep)}
[data-g="o"]{--g:var(--orange);--gd:var(--orange-deep)}
[data-g="g"]{--g:var(--green);--gd:var(--green-deep)}
[data-g="b"]{--g:var(--blue);--gd:var(--blue-deep)}
[hidden]{display:none!important}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 0 18px}
.brand{font:900 1.25rem/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:flex;gap:3px}
.brand i b{width:8px;height:18px;border-radius:2px;background:var(--g)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.top .sp{flex:1}
.acts{display:flex;gap:8px}
.sync{font-size:.8rem;color:var(--muted)}
@media (max-width:720px){
  .brand{font-size:1.05rem}
  .tabs{order:5;flex-basis:100%;display:grid;grid-template-columns:repeat(4,1fr);border-radius:12px}
  .tabs a{text-align:center;padding:8px 2px;border-radius:9px}
  .sync{order:6;flex-basis:100%}
}
.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.sm{padding:4px 10px;font-size:.875rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.icon{border:0;background:transparent;padding:6px 8px;border-radius:6px;color:var(--muted);line-height:1;min-width:32px}
.icon:hover{background:var(--bg);color:var(--ink)}
.icon:disabled{opacity:.3;cursor:default}

.note{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--surface);border:1px dashed var(--muted);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.note .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.empty{color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

/* Bugün */
.day{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.day{grid-template-columns:1fr}}
.rail{display:grid;gap:16px}
.datehead{display:flex;align-items:center;gap:8px}
.datehead h1,.phead h1{font-size:1.5rem;font-weight:900;flex:1;line-height:1.15}
.datehead small,.phead small{display:block;font:500 .85rem var(--f-body);color:var(--muted)}
.big{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font:700 1.5rem var(--f-mono)}
.big span{color:var(--muted);font-size:.9rem}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg)}
.stack span{background:var(--g);min-width:2px}
.legend{display:grid;gap:4px;font-size:.875rem;margin:0;padding:0;list-style:none}
.legend li{display:flex;gap:8px;align-items:center}
.legend li::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--g)}
.legend li span{margin-left:auto;color:var(--muted)}
.next{border-left:6px solid var(--g)}
.next .eyebrow{font-size:.8rem;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.06em}
.next h2{font-size:1.25rem}
.next p{color:var(--muted);font-size:.9rem}
.next .btn,.big-btn{width:100%;padding:12px;font-size:1.05rem;font-weight:700}
.next .btn{background:var(--gd);border-color:var(--gd);color:#fff}
.empty-card h2{font-size:1.1rem}

.listhead{display:flex;align-items:center;gap:12px;margin:0 0 10px;flex-wrap:wrap}
.listhead h2{font-size:1rem;flex:1}
.rows{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--g);border-radius:var(--r);padding:10px 12px}
.row.done{opacity:.55}
.row.done .ttl{text-decoration:line-through}
.row.cur{box-shadow:0 0 0 2px var(--g)}
.pos{font:500 .8rem var(--f-mono);color:var(--muted);min-width:1.4em;text-align:right}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--g);background:transparent;color:transparent;font-weight:700;padding:0;line-height:1;flex:none}
.chk.sm{width:22px;height:22px;font-size:.7rem}
.chk[aria-pressed="true"]{background:var(--g);color:var(--surface)}
.ttl{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.ttl:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.8rem;color:var(--muted);margin-top:2px;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.75rem;white-space:nowrap}
.pill.now{border-color:var(--g);color:var(--g);font-weight:700}
.pill.ok{border-color:var(--green);color:var(--green)}

/* Pomodoro timeline */
.tl{display:flex;gap:2px;height:18px;border-radius:6px;overflow:hidden;margin:0 0 12px}
.tl span{background:var(--g);min-width:3px}
.tl i{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);min-width:3px}
details summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--accent)}
.flow{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px;font-size:.875rem}
.flow li{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:5px 8px;border-radius:6px}
.flow li:nth-child(odd){background:var(--bg)}
.flow li.brk{color:var(--muted)}
.flow em{font-style:normal;font-weight:700;color:var(--g)}

/* Planla */
.phead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
.plan h2{font-size:1rem}
.prow{grid-template-columns:auto 1fr auto}
.pctl{display:flex;align-items:center;gap:4px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.step span{min-width:52px;text-align:center;font-size:.85rem}
@media (max-width:520px){.prow .pctl{grid-column:2 / 4}}
.fill{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:14px}
.fill label{font-size:.85rem;font-weight:700;color:var(--muted)}
.fill select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:16px;min-width:0}
.fill small{grid-column:1 / -1;color:var(--muted);font-size:.8rem}
.pgroup{display:grid;gap:6px;margin-bottom:16px}
.pgroup h3{font-size:.95rem;color:var(--g);border-bottom:2px solid var(--g);padding-bottom:4px}
.pgroup h3 span{font:500 .8rem var(--f-body);color:var(--muted);margin-left:6px}
.prows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.prows li{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prows li div{flex:1;min-width:0}
.prows b{display:block;font-weight:700;overflow-wrap:anywhere}
.prows small{color:var(--muted);font-size:.8rem}

/* Hafta */
.weekscroll{overflow-x:auto;padding-bottom:8px}
.week{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:8px;min-width:1000px}
@media (max-width:720px){.week{grid-template-columns:1fr;min-width:0}.col{min-height:0!important}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;gap:6px;align-content:start;min-height:240px}
.col.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.colhead{border:0;background:none;text-align:left;padding:4px}
.colhead b{font:700 1rem var(--f-display);display:block}
.colhead span{font-size:.8rem;color:var(--muted)}
.chip{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--g);background:color-mix(in srgb,var(--g) 12%,var(--surface));border-radius:6px;padding:5px 8px;font-size:.85rem;overflow-wrap:anywhere}
.chip .num{font-size:.75rem;color:var(--muted);display:block}
.chip.done{opacity:.5;text-decoration:line-through}
.col .add{border:1px dashed var(--line);background:none;border-radius:6px;padding:6px;color:var(--muted);font-size:.85rem}

/* Görevler */
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media (max-width:900px){.groups{grid-template-columns:1fr}}
.group{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--g);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.group>header h2{font-size:1.15rem;color:var(--g)}
.group>header p{font-size:.85rem;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.item{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.item .ttl{font-weight:500;font-size:.95rem}
.item small{display:block;color:var(--muted);font-size:.78rem}
.ops{display:flex}
.inl{display:flex;gap:6px}
.inl input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:16px}
.group a{color:var(--accent);font-size:.85rem}

/* Arşiv */
.ahead{display:grid;gap:10px;margin-bottom:12px}
.ahead h1{font-size:1.5rem;font-weight:900}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{border:2px solid var(--g);background:transparent;color:var(--g);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.875rem}
.fchip[aria-pressed="true"]{background:var(--g);color:var(--surface)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:16px;margin-left:auto}
.dgroup{font-size:.9rem;color:var(--muted);margin:16px 0 6px;font-family:var(--f-body);font-weight:700}
.arows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.arow{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--g);border-radius:8px;padding:8px 12px}

/* Dialog: sits in the part of the screen the keyboard leaves visible; Vazgeç / Kaydet stay on top. */
dialog{--dlg-top:8vh;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;
  width:min(520px,calc(100vw - 16px));position:fixed;inset:auto 0 auto 0;top:calc(var(--vvt,0px) + var(--dlg-top));margin:0 auto;
  max-height:calc(var(--vvh,100vh) - var(--dlg-top) - 12px);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
@media (max-width:640px){dialog{--dlg-top:8px}}
dialog::backdrop{background:rgba(10,12,20,.55)}
html:has(dialog[open]){overflow:hidden}
dialog form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.dlg-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.dlg-bar h2{flex:1;text-align:center;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg-body{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 18px 24px;display:grid;gap:16px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.fld{display:grid;gap:4px}
.fld label,.fld legend{font-size:.85rem;font-weight:700;color:var(--muted);padding:0}
.fld legend{margin-bottom:4px}
.fld small{color:var(--muted);font-size:.8rem}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0;font-size:16px}
.fld input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;text-align:left}
.fld input::-webkit-date-and-time-value{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{position:relative;display:grid;gap:2px;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg i{width:16px;height:16px;border-radius:50%;background:var(--g)}
.seg b{font-size:.95rem}
.seg small{font-size:.75rem;color:var(--muted);line-height:1.25;font-weight:400}
.seg label:has(input:checked){border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--surface))}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt b{display:block}
.opt small{color:var(--muted)}
.err{color:var(--red);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Mini bar + focus screen */
.mini{position:fixed;left:16px;right:16px;bottom:16px;z-index:20;max-width:640px;margin:0 auto;background:var(--gd);color:#fff;border:0;border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.mini span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini b{font:700 1.2rem var(--f-mono)}
.focus{position:fixed;inset:0;z-index:30;background:var(--gd);color:#fff;display:flex;flex-direction:column;padding:20px;overflow:auto;isolation:isolate}
.focus::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,1)*100%);background:rgba(0,0,0,.28);z-index:-1;transition:height 1s linear}
.focus.over .fx-task{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.focus::before{transition:none}.focus.over .fx-task{animation:none}}
.fx-top{display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.fx-top>span:first-child{flex:1;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem}
.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.75)}
.dots i.f{background:#fff;border-color:#fff}
.dots i.c{background:rgba(255,255,255,.4)}
.fx-btn{border:1.5px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:999px;padding:10px 20px;font-weight:700}
.fx-btn:hover{background:rgba(255,255,255,.15)}
.fx-btn.fill{background:#fff;color:var(--gd);border-color:#fff}
.fx-btn.sm{padding:6px 14px;font-size:.875rem}
.fx-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:8px;max-width:1100px;width:100%;margin:0 auto;padding:24px 0}
.fx-eyebrow{font-weight:700;opacity:.85;font-size:.95rem}
.fx-mid h1{font-size:clamp(1.5rem,4.5vw,3rem);font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.fx-digits{font:700 clamp(4.5rem,23vw,17rem)/.95 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin-left:-.04em}
.fx-sub{font-size:clamp(1rem,2.4vw,1.3rem);font-weight:500;opacity:.92}
.fx-task{font-weight:700}
.fx-ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.fx-ctl .fx-btn{font-size:1.02rem;padding:13px 24px}
.fx-foot{max-width:1100px;width:100%;margin:0 auto;font-size:.95rem;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i><b data-g="r"></b><b data-g="o"></b><b data-g="g"></b></i>Odak Planlayıcı</div>
    <nav class="tabs" aria-label="Görünümler">
      <a href="#bugun" data-tab="bugun">Bugün</a>
      <a href="#hafta" data-tab="hafta">Hafta</a>
      <a href="#gorevler" data-tab="gorevler">Görevler</a>
      <a href="#arsiv" data-tab="arsiv">Arşiv</a>
    </nav>
    <span class="sp"></span>
    <div class="acts">
      <button class="btn pri" id="plan-btn" data-act="plan">Planla</button>
      <button class="btn" data-act="new">Yeni görev</button>
    </div>
  </header>
  <div id="note"></div>
  <main id="view"></main>
</div>

<div id="mini"></div>
<div id="focus"></div>

<dialog id="dlg" aria-labelledby="dlg-h">
  <form id="frm" novalidate>
    <div class="dlg-bar">
      <button type="button" class="btn ghost" data-act="close">Vazgeç</button>
      <h2 id="dlg-h">Görev</h2>
      <button type="submit" class="btn pri">Kaydet</button>
    </div>
    <div class="dlg-body" id="dlg-body">
      <p class="err" id="f-err" role="alert" hidden></p>
      <div class="fld"><label for="f-title">Ne yapılacak?</label><input type="text" id="f-title" maxlength="120" autocomplete="off" enterkeyhint="done"></div>
      <fieldset class="fld"><legend>Önem rengi</legend>
        <div class="seg">

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);

const pad = n => String(n).padStart(2, "0");
const G = {
  r: {name: "Kırmızı", desc: "Mutlaka yapılacak"},
  o: {name: "Turuncu", desc: "Orta önemde"},

const GO = {r: 0, o: 1, g: 2};

/* ---------- dates ---------- */

const fmtLongY = s => parse(s).toLocaleDateString("tr-TR", {day: "numeric", month: "long", year: "numeric", weekday: "long"});
const fmtShort = s => parse(s).toLocaleDateString("tr-TR", {day: "numeric", month: "short", ...(s.slice(0, 4) !== today().slice(0, 4) ? {year: "numeric"} : {})});

const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());

/* ---------- state ---------- */

}

let focusOpen = !!run, summary = null;
const ui = {view: "bugun", planDate: today(), week: monday(today()), editId: null, delArm: false, endArm: false, fill: 120,

const task = id => state.tasks.find(t => t.id === id);

/* ---------- persistence: this device's browser storage ---------- */

}

/* ---------- keyboard handling (phones) ---------- */
const coarse = (() => { try { return matchMedia("(pointer: coarse)").matches; } catch { return false; } })();

/* ---------- sound + screen awake ---------- */

const SND = {

  work: [523, 659, 784, 1047],   // break over, focus starts (rising)

    pomo: 0, workMs: 0, doneN: 0, taskId: open[0].id, taskBase: 0, taskFrom: 0, overFor: null};

setInterval(tick, 250);

  const dots = Array.from({length: Math.min(est, 12)}, (_, i) => `<i class="${i < run.pomo ? "f" : i === run.pomo && work ? "c" : ""}"></i>`).join("");
  const restMin = Math.round(open.reduce((a, x) => a + remMs(x), 0) / 60000);
  el.innerHTML = `<section class="focus${work && run.overFor === t.id ? " over" : ""}" data-g="${work ? t.g : "b"}" role="dialog" aria-label="Pomodoro sayacı">

/* ---------- plan preview: pomodoros and breaks ---------- */
function buildSegs(list) {
  const s = S(), F = s.focus * 60000;
  const items = list.filter(t => !t.doneAt).map(t => ({t, rem: remMs(t)})).filter(x => x.rem > 0);
  const total = items.reduce((a, x) => a + x.rem, 0), segs = [];
  let inP = 0, p = 0, used = 0;
  for (const x of items) {
    let rem = x.rem;
    while (rem > 0) {
      const take = Math.min(rem, F - inP);
      segs.push({k: "w", t: x.t, len: take, p: p + 1});
      rem -= take; used += take; inP += take;
      if (inP >= F) {
        p++; inP = 0;
        if (used < total) { const L = s.long > 0 && p % s.every === 0; segs.push({k: L ? "l" : "s", len: (L ? s.long : s.short) * 60000}); }
      }
    }
  }
  if (inP > 0) p++;
  const brk = segs.filter(x => x.k !== "w").reduce((a, x) => a + x.len, 0);
  return {segs, work: total, pomos: p, brk, breaks: segs.filter(x => x.k !== "w").length, all: total + brk};
}
const timeline = b => `<div class="tl" role="img" aria-label="${b.pomos} pomodoro ve ${b.breaks} mola">${b.segs.map(x => x.k === "w"
  ? `<span data-g="${x.t.g}" style="flex:${x.len} 1 0" title="${esc(x.t.title)}"></span>` : `<i style="flex:${x.len} 1 0" title="Mola"></i>`).join("")}</div>`;
function flow(b, startMs) {
  let tc = startMs; const rows = [];
  for (let i = 0; i < b.segs.length;) {
    const x = b.segs[i];
    if (x.k === "w") {
      const p = x.p, names = []; let len = 0;
      while (i < b.segs.length && b.segs[i].k === "w" && b.segs[i].p === p) { names.push(b.segs[i].t); len += b.segs[i].len; i++; }
      rows.push(`<li><span class="num">${hm(new Date(tc))}–${hm(new Date(tc + len))}</span><span>Odak ${p} · ${names.map(t => `<em data-g="${t.g}">${esc(t.title)}</em>`).join(", ")}</span></li>`);
      tc += len;
    } else {
      rows.push(`<li class="brk"><span class="num">${hm(new Date(tc))}–${hm(new Date(tc + x.len))}</span><span>${x.k === "l" ? "Uzun mola" : "Mola"} · ${Math.round(x.len / 60000)} dk</span></li>`);
      tc += x.len; i++;
    }
  }
  return rows.join("");
}

  const wantDone = !!ui.editId && F("done").checked;
  dlg.close();
  if (wantDone && !t.doneAt && run && run.taskId === t.id) { completeCurrent(); return; }
  if (wantDone && !t.doneAt) t.doneAt = stamp();
  if (!wantDone) t.doneAt = null;
  commit(); renderFocus(); renderMini();
});

/* ---------- actions ---------- */
function setView() {
  const h = location.hash.slice(1);
  ui.view = ["hafta", "gorevler", "arsiv", "planla"].includes(h) ? h : "bugun";
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", setView);
function goPlan(d) {
  ui.planDate = d || today();
  if (location.hash === "#planla") { render(); window.scrollTo(0, 0); } else location.hash = "planla";
}
const updateArchive = () => { const r = $("#arch-res"); if (r) r.innerHTML = archResults(); };

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const inp = $("input", f), v = inp.value.trim();
  if (!v) return;
  if (coarse) inp.blur();
  const g = f.dataset.g;
  state.tasks.push({id: uid(), title: v, g, dur: S().focus, created: today(), order: nextOrder(g), doneAt: null, spent: 0});
  inp.value = ""; commit();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.set) {
    state.settings[el.dataset.set] = el.type === "checkbox" ? el.checked : Number(el.value);
    commit(); return;
  }
  if (el.id === "bk-file") { if (el.files && el.files[0]) readBackup(el.files[0]); el.value = ""; return; }
  if (el.id === "fill") ui.fill = Number(el.value);
  if (el.id === "st") { ui.st = el.value; updateArchive(); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { ui.q = e.target.value; updateArchive(); } });

let endT = 0;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, d = b.dataset.date, n = Number(b.dataset.n);
  switch (a) {
    case "new": openDlg(null); break;
    case "edit": openDlg(id); break;
    case "close": dlg.close(); break;
    case "qdur": F("dur").value = n; break;
    case "del": {
      if (!ui.delArm) { ui.delArm = true; b.textContent = "Silmeyi onayla"; break; }
      const delId = ui.editId;
      if (run && run.taskId === delId) { run.taskBase = 0; run.taskFrom = run.phase === "work" ? phaseEl() : 0; }
      state.tasks = state.tasks.filter(t => t.id !== delId);
      for (const k in state.plans) state.plans[k] = state.plans[k].filter(x => x !== delId);
      dlg.close(); commit(); tick(); break;
    }
    case "toggle": {
      const t = task(id); if (!t) break;
      if (!t.doneAt && run && run.taskId === id) { completeCurrent(); break; }
      t.doneAt = t.doneAt ? null : stamp(); delete t.sample;
      commit(); if (run) { renderFocus(); renderMini(); } break;
    }
    case "plan": goPlan(d); break;
    case "run": startRun(); break;
    case "pday": ui.planDate = n ? addDays(ui.planDate, n) : today(); render(); break;
    case "week": ui.week = n ? addDays(ui.week, n * 7) : monday(today()); render(); break;
    case "mv": {
      const t = task(id), ts = openOf(t.g), i = ts.indexOf(t), o = ts[i + n]; if (!o) break;
      ts.forEach((x, j) => { x.order = j; }); [t.order, o.order] = [o.order, t.order]; commit(); break;
    }
    case "padd": { const arr = (state.plans[ui.planDate] ||= []); if (!arr.includes(id)) arr.push(id); commit(); break; }
    case "prm": {
      if (run && run.date === ui.planDate && run.taskId === id) bank();
      state.plans[ui.planDate] = (state.plans[ui.planDate] || []).filter(x => x !== id);
      commit(); tick(); break;
    }
    case "pmv": {
      const arr = planIds(ui.planDate), i = arr.indexOf(id), j = i + n;
      if (i < 0 || j < 0 || j >= arr.length) break;
      [arr[i], arr[j]] = [arr[j], arr[i]]; state.plans[ui.planDate] = arr; commit(); break;
    }
    case "dur": { const t = task(id); if (!t) break; t.dur = Math.max(5, Math.min(600, t.dur + n)); commit(); break; }
    case "fill": {
      const arr = (state.plans[ui.planDate] ||= []), have = new Set(arr);
      let tot = planTasks(ui.planDate).filter(t => !t.doneAt).reduce((s, t) => s + t.dur, 0);
      for (const g of ["r", "o", "g"]) for (const t of openOf(g)) {
        if (!have.has(t.id) && tot + t.dur <= ui.fill) { arr.push(t.id); have.add(t.id); tot += t.dur; }
      }
      commit(); break;
    }
    case "fg": ui.fg[b.dataset.c] = !ui.fg[b.dataset.c]; b.setAttribute("aria-pressed", ui.fg[b.dataset.c]); updateArchive(); break;
    case "clear-sample": {
      const gone = new Set(state.tasks.filter(t => t.sample).map(t => t.id));
      if (run && gone.has(run.taskId)) { run = null; saveRun(); focusOpen = false; wake(false); document.title = "Odak Planlayıcı"; }
      state.tasks = state.tasks.filter(t => !gone.has(t.id));
      for (const k in state.plans) state.plans[k] = state.plans[k].filter(x => !gone.has(x));
      commit(); renderFocus(); renderMini(); break;
    }
    case "bk-export": exportBackup(); break;
    case "bk-apply":
      if (!pendingRestore) break;
      if (run) { run = null; saveRun(); focusOpen = false; wake(false); document.title = "Odak Planlayıcı"; }
      state = pendingRestore; pendingRestore = null; summary = null;
      commit(); renderFocus(); renderMini();
      { const m = $("#bk-msg"); if (m) m.textContent = "Yedek geri yüklendi."; }
      break;
    case "fx-pause": togglePause(); break;
    case "fx-skip": skipBreak(); break;
    case "fx-done": completeCurrent(); break;
    case "fx-defer": deferCurrent(); break;
    case "fx-end":
      if (!ui.endArm) { ui.endArm = true; b.textContent = "Bitirmek için tekrar dokun"; clearTimeout(endT);
        endT = setTimeout(() => { ui.endArm = false; renderFocus(); }, 4000); break; }
      clearTimeout(endT); finishRun(false); break;
    case "fx-hide": focusOpen = false; exitFull(); renderFocus(); renderMini(); render(); break;
    case "fx-show": focusOpen = true; renderFocus(); renderMini(); wake(true); break;
    case "fx-close": summary = null; focusOpen = false; exitFull(); renderFocus(); renderMini(); render(); break;
    case "fx-full": try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch {} break;
  }
});
function exitFull() { try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch {} }

// Keep "Şimdi başlarsan" times fresh without disturbing anything the person is using.
let lastMin = -1;
setInterval(() => {
  const m = new Date().getMinutes();
  if (m === lastMin) return; lastMin = m;
  if ((ui.view === "bugun" || ui.view === "planla") && !dlg.open && !isField(document.activeElement)) render();
}, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && run) { wake(true); tick(); } });

setView(); renderFocus(); renderMini();
if (run && run.running) wake(true);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
